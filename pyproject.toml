[project]
name = "construction-carbon-research"
version = "0.1.0"
description = "Research-stage construction carbon accounting and T-VER screening web app"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
